<!doctype html>
<!-- GENERATED by tools/generate-pages.mjs from tools/page-template.html — edit the template, not this file. -->
<html lang="{{lang}}" dir="ltr" data-root="{{root}}" data-page-lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{canonical}}
{{hreflang}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Punkto">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:locale" content="{{ogLocale}}">
{{ogExtra}}
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFF7EE">
{{adsenseMeta}}
<link rel="icon" href="{{root}}icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="{{root}}icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{root}}icons/apple-touch-icon.png">
<link rel="manifest" href="{{root}}manifest.webmanifest">
<link rel="stylesheet" href="{{root}}css/app.css">
<script>
  // Apply day/night mode before the first paint (no white flash at night).
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('punkto:settings') || '{}');
      var t = s.theme || 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-scheme', dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
<script src="{{root}}config.js"></script>
<script type="module" src="{{root}}js/app.js"></script>
<!--
  Google AdSense: the AdSense loader script is added automatically by js/ads.js
  once you set ads.adsenseClient in config.js (and only for visitors who see ads).
  If AdSense asks you to paste its code into <head> for site verification,
  you can paste it right here — in tools/page-template.html — and re-run
  `node tools/generate-pages.mjs`, or paste it into every index.html.
-->
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
<div id="app">
  <main class="static-intro">
    <h1>{{h1}}</h1>
    <p>{{tagline}}</p>
    <p><strong>{{privacyTitle}}</strong> {{privacyText}}</p>
    {{features}}
    {{uses}}
    {{faq}}
  </main>
</div>
<noscript><p style="text-align:center;padding:16px">Punkto needs JavaScript to run.</p></noscript>
</body>
</html>
