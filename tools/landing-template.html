<!doctype html>
<!-- GENERATED by tools/generate-pages.mjs from tools/landing-template.html and content/landing/<lang>.json — edit those, not this file. -->
<html lang="{{lang}}" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{hreflang}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Punkto">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{site}}icons/og.png">
<meta property="og:locale" content="{{ogLocale}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFF7EE">
{{adsenseMeta}}
<link rel="icon" href="{{root}}icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}icons/apple-touch-icon.png">
<link rel="manifest" href="{{root}}manifest.webmanifest">
<link rel="stylesheet" href="{{root}}css/app.css">
<script>
  // Day/night mode before the first paint (same setting as the app).
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('punkto:settings') || '{}');
      var t = s.theme || 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-scheme', dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
{{analytics}}
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="lp">
<header class="appbar">
  <a class="brand" href="{{appUrl}}">{{logo}}<span>Punkto</span></a>
  <div class="spacer"></div>
  <a class="btn btn-primary" href="{{ctaUrl}}">{{appLabel}}</a>
</header>
<main class="lp-main">
  <section class="lp-hero">
    <div class="lp-hero-text">
      <h1>{{h1}}</h1>
      <p class="lead">{{intro}}</p>
      <a class="btn btn-primary btn-lg" href="{{ctaUrl}}">{{cta}}</a>
      <p class="small muted">{{badges}}</p>
    </div>
    <div class="lp-art">{{art}}</div>
  </section>

  <section class="lp-section">
    <h2>{{howTitle}}</h2>
    <ol class="lp-steps">
{{steps}}
    </ol>
  </section>

  <section class="lp-section">
    <h2>{{whyTitle}}</h2>
    <div class="feature-grid">
{{features}}
    </div>
    <p class="privacy-note lp-privacy">{{privacy}}</p>
  </section>

  <section class="faq lp-section">
    <h2>{{faqTitle}}</h2>
{{faq}}
  </section>

  <section class="lp-cta">
    <a class="btn btn-primary btn-lg" href="{{ctaUrl}}">{{cta}}</a>
  </section>

  <nav class="lp-more" aria-label="{{moreTitle}}">
    <h2>{{moreTitle}}</h2>
    <ul>
{{more}}
    </ul>
  </nav>
</main>
<footer class="site-footer">
  <nav class="footer-links"><a href="{{appUrl}}">Punkto</a><a href="{{appUrl}}#/privacy">{{privacyLink}}</a></nav>
  <nav class="footer-langs">
{{langLinks}}
  </nav>
</footer>
</body>
</html>
